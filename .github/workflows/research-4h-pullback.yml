name: 4h pullback continuation research

on:
  pull_request:
    branches: [research/adaptive-perp-regimes]
    paths:
      - "scripts/research_4h_pullback_continuation.py"
      - "tests/unit/test_research_4h_pullback_continuation.py"
      - "docs/research/FOUR_HOUR_PULLBACK_CONTINUATION.md"
      - ".github/workflows/research-4h-pullback.yml"
  push:
    branches: [research/4h-pullback-continuation]
    paths:
      - "scripts/research_4h_pullback_continuation.py"
      - "tests/unit/test_research_4h_pullback_continuation.py"
      - "docs/research/FOUR_HOUR_PULLBACK_CONTINUATION.md"
      - ".github/workflows/research-4h-pullback.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: 4h-pullback-continuation
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download completed five-symbol BingX archive from parent run #92
        uses: actions/download-artifact@v4
        with:
          name: adaptive-bingx-perpetual-research
          repository: ${{ github.repository }}
          run-id: 42692378936
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Validate candidate and shared archive tests
        run: |
          python -m pytest \
            tests/unit/test_research_4h_pullback_continuation.py \
            tests/unit/test_research_adaptive_perp_portfolio.py \
            tests/test_bingx_usdm_candle_archive.py -q
      - name: Ruff
        run: |
          python -m ruff check --config pyproject.toml \
            scripts/research_4h_pullback_continuation.py \
            tests/unit/test_research_4h_pullback_continuation.py
      - name: Replay at base execution costs
        run: |
          python scripts/research_4h_pullback_continuation.py \
            --signal-timeframe 30m --fee-bps 5 --spread-bps 1.25 --slippage-bps 2 \
            --out reports/four_hour_pullback/base
      - name: Replay at 1.5x execution costs
        run: |
          python scripts/research_4h_pullback_continuation.py \
            --signal-timeframe 30m --fee-bps 7.5 --spread-bps 1.875 --slippage-bps 3 \
            --out reports/four_hour_pullback/stress_1_5x
      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-hour-pullback-continuation-research
          path: |
            data/bingx_usdm/manifest.json
            data/bingx_usdm/funding_manifest.json
            reports/four_hour_pullback/
          if-no-files-found: warn
          retention-days: 90
