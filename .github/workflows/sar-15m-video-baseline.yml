name: SAR 15m video baseline research

on:
  push:
    branches:
      - research/sar-15m-video-reproduction-current
    paths:
      - "docs/research/sar_repro/sar_backtest_engine.py"
      - "docs/research/sar_repro/test_sar_backtest_engine.py"
      - ".github/workflows/sar-15m-video-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sar-15m-video-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install numpy pandas requests pytest ruff
      - name: Test SAR engine and interval handling
        run: python -m pytest docs/research/sar_repro/test_sar_backtest_engine.py -q
      - name: Lint SAR engine
        run: python -m ruff check docs/research/sar_repro/sar_backtest_engine.py docs/research/sar_repro/test_sar_backtest_engine.py
      - name: Run frozen-rule 15m baseline on BingX
        run: |
          python docs/research/sar_repro/sar_backtest_engine.py \
            --start 5000 \
            --out sar_repro_15m_out \
            --interval 15m \
            --limit-total 36000
      - name: Upload raw candles and SAR replay artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sar-15m-video-baseline-${{ github.sha }}
          path: sar_repro_15m_out/
          if-no-files-found: error
          retention-days: 30
