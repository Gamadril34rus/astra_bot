name: sprint-restore-engine
on:
  push:
    branches: [feat/min-rr-2.0-memo-process]
    paths:
      - "scripts/TRIGGER_RESTORE"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/min-rr-2.0-memo-process
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore engine min_rr=2.0
        run: |
          set -euo pipefail
          git fetch origin master
          python3 scripts/restore_engine_minrr20.py
          git config user.name "astra-sprint-bot"
          git config user.email "bot@users.noreply.github.com"
          git add astra_bot/decision/trading_engine.py
          git commit -m "fix: restore trading_engine + min_rr=2.0 (owner align clamp)" || echo "nothing"
          git push origin HEAD:feat/min-rr-2.0-memo-process
