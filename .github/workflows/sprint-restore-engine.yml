name: sprint-restore-engine
on:
  push:
    branches: [feat/zeus-activation-sprint]
    paths:
      - "scripts/TRIGGER_RESTORE"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zeus-activation-sprint
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch master and restore engine
        run: |
          set -euo pipefail
          git fetch origin master
          python3 scripts/restore_engine_sprint.py
          git config user.name "astra-sprint-bot"
          git config user.email "bot@users.noreply.github.com"
          git add astra_bot/decision/trading_engine.py
          git commit -m "fix(sprint): restore trading_engine from master + sprint patches" || echo "nothing to commit"
          git push origin HEAD:feat/zeus-activation-sprint
