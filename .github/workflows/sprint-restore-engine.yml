name: sprint-restore-engine
# Dispatch-only: do not auto-run on push (avoids races with manual fixes).
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zeus-activation-sprint
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore trading_engine from master and patch
        run: |
          set -euo pipefail
          echo "Manual restore disabled after successful fix commit. No-op."
          exit 0
