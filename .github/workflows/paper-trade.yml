name: Paper trade (hourly)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: astra-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/019fe76b-astra-bot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Write .env
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          cat > .env <<EOF
          ENVIRONMENT=paper
          PAPER_TRADING=true
          OKX_API_KEY=$OKX_API_KEY
          OKX_API_SECRET=$OKX_API_SECRET
          OKX_API_PASSPHRASE=$OKX_API_PASSPHRASE
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_ADMIN_ID=$TELEGRAM_ADMIN_ID
          EOF

      - name: One trading step
        run: python scripts/run_paper.py --once

      - name: Commit state
        if: always()
        run: |
          git config user.name "astra-bot"
          git config user.email "bot@users.noreply.github.com"
          git add models/ || true
          git commit -m "chore(ci): paper state $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git push origin arena/019fe76b-astra-bot || true
