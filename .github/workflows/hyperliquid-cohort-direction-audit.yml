name: Hyperliquid large-wallet position-direction audit

on:
  push:
    branches: [research/wallet-flow-confirmation]
    paths:
      - "scripts/research/hyperliquid_cohort_direction_audit.py"
      - "tests/unit/test_hyperliquid_cohort_direction_audit.py"
      - ".github/workflows/hyperliquid-cohort-direction-audit.yml"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Public Info API lookback (1-24 hours)"
        type: number
        required: false
        default: 24
      max_wallets:
        description: "Bounded wallet subset (1-40)"
        type: number
        required: false
        default: 20

permissions:
  actions: read
  contents: read

concurrency:
  group: hyperliquid-wallet-direction-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOOKBACK_HOURS: ${{ inputs.lookback_hours || 24 }}
      MAX_WALLETS: ${{ inputs.max_wallets || 20 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Test and lint public direction audit
        run: |
          python -m pytest tests/unit/test_hyperliquid_cohort_direction_audit.py -q --confcutdir=tests/unit
          python -m ruff check scripts/research/hyperliquid_cohort_direction_audit.py tests/unit/test_hyperliquid_cohort_direction_audit.py
      - name: Download frozen wallet cohort manifest
        uses: actions/download-artifact@v4
        with:
          name: hyperliquid-wallet-archive-summary
          run-id: 43250750091
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: manifest_evidence
      - name: Run bounded public Info API direction audit
        run: |
          python scripts/research/hyperliquid_cohort_direction_audit.py \
            --manifest manifest_evidence/hyperliquid_wallet_archive/wallet_archive_manifest.json \
            --lookback-hours "$LOOKBACK_HOURS" \
            --max-wallets "$MAX_WALLETS" \
            --max-fills-per-day 5000 \
            --out-dir reports/hyperliquid_direction_audit
      - name: Upload aggregate-only direction audit
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-wallet-direction-audit-${{ github.sha }}
          path: |
            reports/hyperliquid_direction_audit/hyperliquid_wallet_direction_audit.csv
            reports/hyperliquid_direction_audit/hyperliquid_wallet_direction_summary.json
          if-no-files-found: error
          retention-days: 30
