name: CLT Hyperliquid source candles

on:
  pull_request:
    branches: [master]
    paths:
      - "scripts/research/clt_hyperliquid_candles.py"
      - "tests/research/test_clt_hyperliquid_candles.py"
      - ".github/workflows/clt-hyperliquid-candles.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clt-hyperliquid-source-candles
  cancel-in-progress: false

jobs:
  candles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install isolated test tools
        run: python -m pip install pytest ruff
      - name: Test and lint source candle collector
        run: |
          python -m pytest tests/research/test_clt_hyperliquid_candles.py -q --confcutdir=tests/research
          python -m ruff check scripts/research/clt_hyperliquid_candles.py tests/research/test_clt_hyperliquid_candles.py
      - name: Download Hyperliquid source candles
        run: |
          python scripts/research/clt_hyperliquid_candles.py \
            --start 2026-10-03T00:00:00+00:00 \
            --end 2026-11-09T00:00:00+00:00 \
            --out-dir reports/clt_hyperliquid_candles
      - name: Upload source candles and coverage
        uses: actions/upload-artifact@v4
        with:
          name: clt-hyperliquid-source-candles-${{ github.sha }}
          path: |
            reports/clt_hyperliquid_candles/hyperliquid_15m.csv
            reports/clt_hyperliquid_candles/hyperliquid_15m_coverage.json
          if-no-files-found: error
          retention-days: 30
