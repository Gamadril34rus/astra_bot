name: Generate trade card examples

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master
  push:
    branches:
      - fix/trade-card-art-slot

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trade-card-art-slot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Render canonical examples
        run: python docs/examples/generate_trade_cards.py
      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/examples/trade_card_plus.png docs/examples/trade_card_minus.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(viz): add rendered trade card examples"
            git push
          fi
