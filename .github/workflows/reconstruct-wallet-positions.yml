name: Reconstruct public-wallet position episodes from dated anchor

on:
  push:
    branches: [research/4h-pullback-continuation]
    paths:
      - ".github/workflows/reconstruct-wallet-positions.yml"
      - "scripts/reconstruct_hyperliquid_wallet_positions.py"
      - "tests/unit/test_reconstruct_hyperliquid_wallet_positions.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: reconstruct-wallet-positions
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research.txt pandas pytest
      - name: Test position reconstruction
        run: python -m pytest tests/unit/test_reconstruct_hyperliquid_wallet_positions.py -q --confcutdir=tests/unit
      - name: Download frozen cohort snapshot
        uses: actions/download-artifact@v4
        with:
          name: public-wallet-behaviour-panel
          run-id: 43221654045
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: cohort
      - name: Download verified 37-day wallet-side trade archive
        uses: actions/download-artifact@v4
        with:
          name: hyperliquid-wallet-archive-research
          run-id: 43250750091
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: wallet_archive
      - name: Download dated position and account-value anchors
        run: |
          curl --fail --location --retry 5 --retry-delay 2 \
            https://huggingface.co/datasets/Hydromancer/hyperliquid-reservoir/resolve/main/snapshots/positions_2026-10-19.parquet \
            --output positions_2026-10-19.parquet
          curl --fail --location --retry 5 --retry-delay 2 \
            https://huggingface.co/datasets/Hydromancer/hyperliquid-reservoir/resolve/main/snapshots/account_values_2026-10-19.parquet \
            --output account_values_2026-10-19.parquet
      - name: Reconstruct position episodes around the dated anchor
        run: |
          WALLET_TRADES="$(find wallet_archive -type f -name wallet_trades.parquet -print -quit)"
          COHORT="$(find cohort -type f -name leaderboard_snapshot.json -print -quit)"
          test -n "$WALLET_TRADES"
          test -n "$COHORT"
          python scripts/reconstruct_hyperliquid_wallet_positions.py \
            --wallet-trades "$WALLET_TRADES" \
            --positions positions_2026-10-19.parquet \
            --account-values account_values_2026-10-19.parquet \
            --cohort "$COHORT" \
            --out-dir reports/hyperliquid_position_reconstruction
      - name: Upload position reconstruction evidence
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-position-reconstruction
          path: reports/hyperliquid_position_reconstruction/
          if-no-files-found: error
          retention-days: 90
