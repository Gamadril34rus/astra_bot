name: Daily train + report

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: astra-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Write .env
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          : > .env
          echo "ENVIRONMENT=paper" >> .env
          echo "PAPER_TRADING=true" >> .env
          echo "OKX_API_KEY=$OKX_API_KEY" >> .env
          echo "OKX_API_SECRET=$OKX_API_SECRET" >> .env
          echo "OKX_API_PASSPHRASE=$OKX_API_PASSPHRASE" >> .env
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" >> .env
          echo "TELEGRAM_ADMIN_ID=$TELEGRAM_ADMIN_ID" >> .env
          chmod 600 .env

      - name: Connection test
        run: python scripts/test_okx.py

      - name: Multi-timeframe training
        run: python scripts/train_multi_timeframe.py --days 1095 --target-trades 1000

      - name: Morning report
        if: always()
        run: python scripts/morning_report.py

      - name: Commit artifacts
        if: always()
        run: |
          git config user.name "astra-bot"
          git config user.email "bot@users.noreply.github.com"
          git add models/ || true
          git commit -m "chore(ci): daily model retrain $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push origin master || echo "push failed"
