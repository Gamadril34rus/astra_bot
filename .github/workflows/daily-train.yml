name: Five-year pretrain (manual)

on:
  workflow_dispatch:
    inputs:
      with_news:
        description: "Use NEWS_API_KEY for historical news enrichment"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  pretrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Write paper environment
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          echo "ENVIRONMENT=paper" > .env
          echo "PAPER_TRADING=true" >> .env
          echo "OKX_DEMO=1" >> .env
          echo "NEWS_API_KEY=$NEWS_API_KEY" >> .env
          chmod 600 .env

      - name: Five-year market-aware walk-forward pretrain
        run: |
          if [ "${{ inputs.with_news }}" = "true" ]; then
            python scripts/pretrain_5y_enhanced.py --years 5 --target-trades 5000 --min-samples 2000 --capital 10000 --with-news
          else
            python scripts/pretrain_5y_enhanced.py --years 5 --target-trades 5000 --min-samples 2000 --capital 10000
          fi

      - name: Persist lessons, market memory and model
        run: |
          git config user.name "astra-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f models/current.pkl models/lessons*.jsonl models/news_cache.json models/market_memory.json models/training_state.json 2>/dev/null || true
          git commit -m "chore(training): five-year market-aware pretrain $(date -u +%Y-%m-%d)" || true
          git push origin master || true
