name: Daily train + report

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: astra-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Write .env
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          {
            echo "ENVIRONMENT=paper"
            echo "PAPER_TRADING=true"
            echo "OKX_DEMO=1"
            echo "OKX_API_KEY=$OKX_API_KEY"
            echo "OKX_API_SECRET=$OKX_API_SECRET"
            echo "OKX_API_PASSPHRASE=$OKX_API_PASSPHRASE"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_ADMIN_ID=$TELEGRAM_ADMIN_ID"
          } > .env
          chmod 600 .env

      - name: Connection test
        run: python scripts/test_okx.py

      - name: Multi-timeframe training
        run: python scripts/train_multi_timeframe.py --days 1095 --target-trades 1000

      - name: Morning report
        if: always()
        run: python scripts/morning_report.py

      - name: Commit artifacts
        if: always()
        run: |
          git config user.name "astra-bot"
          git config user.email "bot@users.noreply.github.com"
          # models/ в .gitignore, но состояния обучения и уроки нужно
          # сохранять между запусками — добавляем явно через -f.
          git add -f models/training_state.json models/lessons*.jsonl 2>/dev/null || true
          git add -f models/current.pkl models/*.pkl 2>/dev/null || true
          git commit -m "chore(ci): daily model retrain $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push origin master || echo "push failed"
