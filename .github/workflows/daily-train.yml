name: Five-year pretrain (research-first)

on:
  workflow_dispatch:
    inputs:
      with_news:
        description: "Use NEWS_API_KEY for historical news enrichment"
        required: false
        default: true
        type: boolean
  schedule:
    # One bounded historical month per run. The progress file advances automatically.
    - cron: "0 */2 * * *"

permissions:
  contents: write

# Never cancel an active month because another scheduled/manual run appeared.
# There is intentionally no push trigger: training commits must not retrigger training.
concurrency:
  group: astra-pretrain-monthly
  cancel-in-progress: false

jobs:
  pretrain:
    if: github.actor != 'astra-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Write paper environment
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          set -euo pipefail
          echo "ENVIRONMENT=paper" > .env
          echo "PAPER_TRADING=true" >> .env
          echo "OKX_DEMO=1" >> .env
          echo "NEWS_API_KEY=$NEWS_API_KEY" >> .env
          chmod 600 .env

      - name: Five-year research-first pretrain (one month)
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          WITH_NEWS="${{ inputs.with_news }}"
          if [ -z "$WITH_NEWS" ]; then WITH_NEWS="true"; fi
          if [ "$WITH_NEWS" = "true" ]; then
            python scripts/pretrain_research_runtime.py --years 5 --target-trades 5000 --min-samples 2000 --capital 10000 --with-news
          else
            python scripts/pretrain_research_runtime.py --years 5 --target-trades 5000 --min-samples 2000 --capital 10000
          fi

      - name: Validate research artifacts
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          test -s models/research_observations.jsonl
          test -s models/research_summary.json
          test -s models/pretrain_progress.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("models/research_summary.json").read_text(encoding="utf-8"))
          progress = json.loads(Path("models/pretrain_progress.json").read_text(encoding="utf-8"))
          observations = sum(int(v.get("observations", 0)) for v in summary.values())
          oos = sum(int(v.get("validation_observations", 0)) for v in summary.values())
          if observations <= 0 or oos <= 0:
              raise SystemExit("Research did not produce discovery and OOS observations")
          print(f"month={progress['completed_months'][-1] if progress['completed_months'] else 'n/a'} observations={observations} oos={oos} next={progress['next_month']}")
          PY

      - name: Persist research, lessons, memory and model
        run: |
          set -euo pipefail
          git config user.name "astra-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f \
            models/current.pkl \
            models/lessons*.jsonl \
            models/news_cache.json \
            models/market_memory.json \
            models/pretrain_progress.json \
            models/research_observations*.jsonl \
            models/research_hypotheses*.json \
            models/research_summary.json
          if git diff --cached --quiet; then
            echo "No training artifacts changed"
          else
            git commit -m "chore(training): pretrain historical month $(date -u +%Y-%m)"
            git push origin master
          fi
