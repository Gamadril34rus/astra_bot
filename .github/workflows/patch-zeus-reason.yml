name: patch-zeus-reason
on:
  workflow_dispatch:
  push:
    branches: [fix/zeus-reason-field]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add zeus_reason to features
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("astra_bot/strategies/zeus_wedge_retest.py")
          t = p.read_text()
          if "zeus_reason" in t:
              print("already present")
              raise SystemExit(0)
          needle = (
              '"reason": (\n'
              '                    f"{pattern}: wedge upper={upper:.4f} lower={lower:.4f} "\n'
              '                    f"width_pct={width_pct:.4f} bars_outside={bars_after}"\n'
              '                ),'
          )
          insert = (
              needle
              + '\n                "zeus_reason": (\n'
              + '                    f"{pattern}: wedge upper={upper:.4f} lower={lower:.4f} "\n'
              + '                    f"width_pct={width_pct:.4f} bars_outside={bars_after}"\n'
              + '                ),'
          )
          if needle not in t:
              raise SystemExit("needle not found in zeus_wedge_retest.py")
          p.write_text(t.replace(needle, insert, 1))
          print("patched ok")
          PY
      - name: Commit to master
        run: |
          git config user.name astra-bot
          git config user.email bot@users.noreply.github.com
          git add astra_bot/strategies/zeus_wedge_retest.py
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "fix(zeus): add zeus_reason to signal features"
          git push origin HEAD:master
