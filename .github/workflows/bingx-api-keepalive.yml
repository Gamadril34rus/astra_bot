name: BingX API keep-alive

# Раз в сутки: подписанный запрос баланса (VST/demo по умолчанию).
# Сбрасывает правило BingX «14 дней без API → удаление ключа без IP».
# В Telegram владельцу — краткий equity (если заданы TG secrets).
# Ордеров нет. Только чтение.

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC ≈ 12:00 МСК
  workflow_dispatch:

concurrency:
  group: bingx-api-keepalive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ping BingX balance (keep-alive)
        env:
          PYTHONPATH: ${{ github.workspace }}
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          # VST/demo по умолчанию (live_env.resolve_base_url).
          # Для mainnet-ключа: ZEUS_MAINNET=1 и ZEUS_VST=0 в repo Variables.
          ZEUS_VST: "1"
        run: python scripts/bingx_api_keepalive.py
