name: SAR fixed-filter proxy experiments

on:
  push:
    branches: [research/sar-proxy-fixed-filters]
    paths:
      - "docs/research/sar_repro/sar_proxy_filter_experiments.py"
      - ".github/workflows/sar-proxy-fixed-filters.yml"

permissions:
  contents: read

concurrency:
  group: sar-proxy-fixed-filters
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install numpy pandas requests
      - name: Collect and validate the frozen Binance USD-M dataset
        run: |
          python docs/research/sar_repro/download_binance_proxy.py \
            --start 2025-11-01T00:00:00Z \
            --end 2026-11-01T00:00:00Z \
            --symbols BTCUSDT ETHUSDT SOLUSDT \
            --out artifacts/sar_binance_proxy
      - name: Run fixed, pre-registered filter hypotheses
        run: |
          python docs/research/sar_repro/sar_proxy_filter_experiments.py \
            --data-dir artifacts/sar_binance_proxy \
            --out-dir artifacts/sar_binance_proxy/fixed_filter_results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sar-proxy-fixed-filters-2025-11-01-to-2026-11-01
          path: artifacts/sar_binance_proxy/fixed_filter_results/
          if-no-files-found: error
          retention-days: 14
