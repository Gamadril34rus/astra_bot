name: SAR Binance proxy dataset

on:
  push:
    branches: [research/sar-binance-proxy-data]
    paths:
      - "docs/research/sar_repro/download_binance_proxy.py"
      - "docs/research/sar_repro/sar_proxy_backtest.py"
      - "docs/research/sar_repro/sar_backtest_engine.py"
      - "docs/research/sar_repro/sar_funding.py"
      - ".github/workflows/sar-binance-proxy-data.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sar-binance-proxy-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install numpy pandas requests
      - name: Download and validate one year of USD-M 15m candles and funding
        run: |
          python docs/research/sar_repro/download_binance_proxy.py \
            --start 2025-11-01T00:00:00Z \
            --end 2026-11-01T00:00:00Z \
            --symbols BTCUSDT ETHUSDT SOLUSDT \
            --out artifacts/sar_binance_proxy
      - name: Reproduce exact 15m SAR baseline and cost sensitivity
        run: |
          python docs/research/sar_repro/sar_proxy_backtest.py \
            --data-dir artifacts/sar_binance_proxy \
            --out-dir artifacts/sar_binance_proxy/results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sar-binance-proxy-15m-2025-11-01-to-2026-11-01
          path: artifacts/sar_binance_proxy/
          if-no-files-found: error
          retention-days: 14
