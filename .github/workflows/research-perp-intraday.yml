name: Research USDT perpetual intraday (30m)

on:
  push:
    branches: [research/perp-intraday-30m]
    paths:
      - "scripts/research_perp_intraday.py"
      - "scripts/research_tests/test_research_perp_intraday.py"
      - "docs/research/RESEARCH_PERP_INTRADAY_30M.md"
      - ".github/workflows/research-perp-intraday.yml"
  pull_request:
    paths:
      - "scripts/research_perp_intraday.py"
      - "scripts/research_tests/test_research_perp_intraday.py"
      - "docs/research/RESEARCH_PERP_INTRADAY_30M.md"
      - ".github/workflows/research-perp-intraday.yml"

permissions:
  contents: read

concurrency:
  group: research-perp-intraday-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-market-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest
      - name: Run isolated unit tests
        run: python -m pytest scripts/research_tests/test_research_perp_intraday.py -q
      - name: Fetch and validate USDT perpetual candles and funding, then backtest
        run: python scripts/research_perp_intraday.py --output reports/research_perp_intraday
      - name: Upload immutable research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perp-intraday-30m-${{ github.run_id }}
          path: reports/research_perp_intraday/
          if-no-files-found: warn
          retention-days: 90
