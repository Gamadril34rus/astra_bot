name: Quarter-hour boundary research

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/quarter-hour-boundary-research.yml"
      - "config/research/quarter_hour_boundary.json"
      - "scripts/research/quarter_hour_boundary.py"
      - "scripts/research/run_coarse_30m_boundary.py"

permissions:
  contents: read

concurrency:
  group: quarter-hour-boundary-research
  cancel-in-progress: true

jobs:
  event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install aiohttp numpy pandas
      - name: Read the canonical per-symbol history start times
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/Gamadril34rus/astra_bot/research/positioning-data/data/bingx_usdm/manifest.json \
            --output reference-manifest.json
      - name: Download canonical 30m archives and run coarse event study
        run: |
          mkdir -p reports/quarter_hour_boundary/data
          for symbol in BTC ETH SOL HYPE INJ; do
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/Gamadril34rus/astra_bot/research/positioning-data/data/bingx_usdm/${symbol}USDT_30m.csv" \
              --output "reports/quarter_hour_boundary/data/${symbol}USDT_30m.csv"
          done
          python scripts/research/run_coarse_30m_boundary.py \
            --data-dir reports/quarter_hour_boundary/data \
            --manifest reference-manifest.json \
            --output-dir reports/quarter_hour_boundary/data \
            --report reports/quarter_hour_boundary/coarse_30m_report.json
      - name: Upload reproducible dataset and report
        uses: actions/upload-artifact@v4
        with:
          name: quarter-hour-boundary-research
          path: reports/quarter_hour_boundary/
          if-no-files-found: error
          retention-days: 90
