name: Quarter-hour boundary research

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/quarter-hour-boundary-research.yml"
      - "config/research/quarter_hour_boundary.json"
      - "scripts/research/quarter_hour_boundary.py"

permissions:
  contents: read

concurrency:
  group: quarter-hour-boundary-research
  cancel-in-progress: false

jobs:
  event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install aiohttp numpy pandas
      - name: Read the canonical per-symbol history start times
        run: |
          git fetch --no-tags origin research/positioning-data
          git show FETCH_HEAD:data/bingx_usdm/manifest.json > reference-manifest.json
      - name: Download 5m candles and historical funding, then run frozen study
        run: |
          python scripts/research/quarter_hour_boundary.py \
            --fetch \
            --reference-manifest reference-manifest.json \
            --data-dir reports/quarter_hour_boundary/data \
            --report reports/quarter_hour_boundary/report.json
      - name: Upload reproducible dataset and report
        uses: actions/upload-artifact@v4
        with:
          name: quarter-hour-boundary-research
          path: reports/quarter_hour_boundary/
          if-no-files-found: error
          retention-days: 90
