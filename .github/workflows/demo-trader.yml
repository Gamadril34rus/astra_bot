name: ASTRA Demo Trader

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/demo_trader_pro.py"
      - "scripts/pretrain_5y_enhanced.py"
      - "astra_bot/ml/market_understanding.py"
      - "astra_bot/ml/market_memory.py"
      - ".github/workflows/demo-trader.yml"
  schedule:
    # GitHub Actions is not a permanent server. Restart the demo worker every 6h.
    - cron: "0 */6 * * *"

concurrency:
  group: astra-demo-trader
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  demo-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Write demo environment
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: |
          echo "ENVIRONMENT=paper" > .env
          echo "PAPER_TRADING=true" >> .env
          echo "OKX_DEMO=1" >> .env
          echo "OKX_API_KEY=$OKX_API_KEY" >> .env
          echo "OKX_API_SECRET=$OKX_API_SECRET" >> .env
          echo "OKX_API_PASSPHRASE=$OKX_API_PASSPHRASE" >> .env
          chmod 600 .env

      - name: Verify OKX private API
        run: python scripts/test_okx.py

      - name: Bootstrap five-year market-aware model when needed
        env:
          PYTHONPATH: .
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p logs models
          if [ ! -f models/market_aware_model.ok ] || [ ! -f models/current.pkl ]; then
            echo "Market-aware model marker missing. Starting enhanced five-year walk-forward pretrain..."
            python scripts/pretrain_5y_enhanced.py --years 5 --target-trades 5000 --min-samples 2000 --capital 10000 --with-news
            printf '%s\n' "market_understanding_v1" > models/market_aware_model.ok

            git config user.name "astra-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -f models/current.pkl models/lessons*.jsonl models/news_cache.json models/market_memory.json models/market_aware_model.ok
            git commit -m "chore(train): bootstrap five-year market-aware model" || true
            git push origin master || true
          else
            echo "Market-aware model found: $(du -h models/current.pkl | cut -f1)"
          fi

      - name: Start continuous market-aware demo worker with checkpoints
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p logs models

          SESSION_SECONDS=3000
          END_AT=$(( $(date +%s) + 330*60 ))

          while [ "$(date +%s)" -lt "$END_AT" ]; do
            echo "Starting market-aware demo worker session..."
            timeout "$SESSION_SECONDS" python scripts/demo_trader_pro.py || true

            git config user.name "astra-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -f models/demo_state.json models/lessons*.jsonl models/current.pkl models/market_memory.json models/market_aware_model.ok models/*.pkl 2>/dev/null || true
            git commit -m "chore(demo): checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git push origin master || echo "checkpoint push failed"

            git fetch origin master
            git reset --hard origin/master
          done

      - name: Final checkpoint
        if: always()
        run: |
          git config user.name "astra-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f models/demo_state.json models/lessons*.jsonl models/current.pkl models/market_memory.json models/market_aware_model.ok models/*.pkl 2>/dev/null || true
          git commit -m "chore(demo): final checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin master || true
