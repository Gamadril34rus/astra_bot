name: ASTRA Demo Trader

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/demo_trader_pro.py"
      - "scripts/demo_trader_safe.py"
      - "scripts/pretrain_5y_enhanced.py"
      - "astra_bot/ml/research_engine.py"
      - "astra_bot/ml/market_understanding.py"
      - "astra_bot/ml/market_memory.py"
      - "astra_bot/core/readiness.py"
      - ".github/workflows/demo-trader.yml"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: astra-demo-trader
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  demo-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Write demo environment
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "ENVIRONMENT=paper" > .env
          echo "PAPER_TRADING=true" >> .env
          echo "OKX_DEMO=1" >> .env
          echo "PAPER_STARTING_CAPITAL=10000" >> .env
          echo "OKX_API_KEY=$OKX_API_KEY" >> .env
          echo "OKX_API_SECRET=$OKX_API_SECRET" >> .env
          echo "OKX_API_PASSPHRASE=$OKX_API_PASSPHRASE" >> .env
          chmod 600 .env

      - name: Verify OKX private API
        run: python scripts/test_okx.py

      - name: Validate trained model and lesson memory
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          test -s models/current.pkl
          test -s models/lessons.jsonl
          python - <<'PY'
          from pathlib import Path
          import pickle
          model_path = Path("models/current.pkl")
          lessons_path = Path("models/lessons.jsonl")
          with model_path.open("rb") as fh:
              pickle.load(fh)
          lessons = sum(1 for line in lessons_path.open(encoding="utf-8") if line.strip())
          print(f"Model: {model_path.stat().st_size} bytes")
          print(f"Historical lessons: {lessons}")
          if lessons < 100:
              print("WARNING: trade lessons are below 100; research memory is the primary learning source.")
          else:
              print("Trained model and lesson memory are valid")
          PY

      - name: Validate research memory
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          if [ -s models/research_summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("models/research_summary.json").read_text(encoding="utf-8"))
          observations = sum(int(v.get("observations", 0)) for v in summary.values())
          oos = sum(int(v.get("validation_observations", 0)) for v in summary.values())
          print(f"Research memory: observations={observations} oos={oos}")
          if observations <= 0:
              raise SystemExit("Research memory exists but contains no observations")
          PY
          else
            echo "Research memory not present yet; demo mode can continue."
          fi

      - name: Start continuous safe market-aware demo worker with checkpoints
        env:
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          set -euo pipefail
          set -a
          . ./.env
          set +a
          mkdir -p logs models

          SESSION_SECONDS=3000
          END_AT=$(( $(date +%s) + 330*60 ))

          while [ "$(date +%s)" -lt "$END_AT" ]; do
            echo "Starting safe market-aware virtual-paper session..."
            rc=0
            timeout "$SESSION_SECONDS" python scripts/demo_trader_safe.py || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
              echo "Demo worker failed with exit code $rc"
              exit "$rc"
            fi
            if [ "$rc" -eq 124 ]; then
              echo "Demo worker reached the checkpoint interval normally."
            fi

            git config user.name "astra-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -f models/demo_state.json models/lessons*.jsonl models/current.pkl models/market_memory.json models/market_aware_model.ok models/risk_guard.json models/readiness.json models/*.pkl 2>/dev/null || true
            git commit -m "chore(demo): checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git push origin master || echo "checkpoint push failed"

            git fetch origin master
            git reset --hard origin/master
          done

      - name: Final checkpoint
        if: always()
        run: |
          set -euo pipefail
          git config user.name "astra-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f models/demo_state.json models/lessons*.jsonl models/current.pkl models/market_memory.json models/market_aware_model.ok models/risk_guard.json models/readiness.json models/*.pkl 2>/dev/null || true
          git commit -m "chore(demo): final checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin master || true
