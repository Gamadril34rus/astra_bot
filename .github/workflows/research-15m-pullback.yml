name: 15m pullback continuation research

on:
  pull_request:
    branches: [research/adaptive-perp-regimes]
    paths:
      - "scripts/research_15m_pullback_continuation.py"
      - "scripts/research_adaptive_perp_portfolio.py"
      - "scripts/probe_bingx_public_history.py"
      - "scripts/archive_bingx_funding_history.py"
      - "scripts/archive_bingx_usdm_candles.py"
      - "tests/unit/test_research_15m_pullback_continuation.py"
      - "tests/unit/test_research_adaptive_perp_portfolio.py"
      - "tests/unit/test_bingx_public_history_probe.py"
      - "tests/test_bingx_usdm_candle_archive.py"
      - "docs/research/FIFTEEN_MINUTE_PULLBACK_CONTINUATION.md"
      - ".github/workflows/research-15m-pullback.yml"
  push:
    branches: [research/4h-pullback-continuation]
    paths:
      - "scripts/research_15m_pullback_continuation.py"
      - "scripts/research_adaptive_perp_portfolio.py"
      - "scripts/probe_bingx_public_history.py"
      - "scripts/archive_bingx_funding_history.py"
      - "scripts/archive_bingx_usdm_candles.py"
      - "tests/unit/test_research_15m_pullback_continuation.py"
      - "tests/unit/test_research_adaptive_perp_portfolio.py"
      - "tests/unit/test_bingx_public_history_probe.py"
      - "tests/test_bingx_usdm_candle_archive.py"
      - "docs/research/FIFTEEN_MINUTE_PULLBACK_CONTINUATION.md"
      - ".github/workflows/research-15m-pullback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 15m-pullback-continuation
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      BINGX_ARCHIVE_QPS: "0.2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run candidate and archive tests
        run: |
          python -m pytest \
            tests/unit/test_research_15m_pullback_continuation.py \
            tests/unit/test_research_adaptive_perp_portfolio.py \
            tests/unit/test_bingx_public_history_probe.py \
            tests/test_bingx_usdm_candle_archive.py -q
      - name: Ruff
        run: |
          python -m ruff check --config pyproject.toml \
            scripts/research_15m_pullback_continuation.py \
            scripts/research_adaptive_perp_portfolio.py \
            scripts/probe_bingx_public_history.py \
            tests/unit/test_research_15m_pullback_continuation.py \
            tests/unit/test_bingx_public_history_probe.py
      - name: Probe free BingX historical trade and kline depth
        run: |
          python scripts/probe_bingx_public_history.py \
            --symbol BTC-USDT --out reports/bingx_public_history_probe.json
      - name: Download BingX historical perpetual funding
        run: |
          set -euo pipefail
          python scripts/archive_bingx_funding_history.py --start-date 2021-01-01
      - name: Download BingX USDT-M 15m and 1h candles
        run: |
          set -euo pipefail
          python scripts/archive_bingx_usdm_candles.py \
            --mode initial --start-date 2021-01-01 --timeframes 15m,1h
      - name: Verify archive provenance, gaps and SHA-256
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("data/bingx_usdm")
          manifest = json.loads((root / "manifest.json").read_text())
          funding_manifest = json.loads((root / "funding_manifest.json").read_text())
          assert manifest["exchange"] == "BingX"
          assert manifest["market"] == "USDT-M perpetual swaps"
          assert set(manifest["timeframes"]) == {"15m", "1h"}
          assert funding_manifest["exchange"] == "BingX"
          assert funding_manifest["market"] == "USDT-M perpetual swaps"
          assert len(manifest["archives"]) == 10
          for key, item in manifest["archives"].items():
              symbol, timeframe = key.split(":")
              path = root / f"{symbol.replace('-', '')}_{timeframe}.csv"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == item["sha256"], f"candle checksum mismatch: {key}"
              assert item["gap_count"] == 0, f"candle gaps: {key}"
          for item in funding_manifest["reports"]:
              path = Path(item["file"])
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == item["sha256"], f"funding checksum mismatch: {item['symbol']}"
          print("BingX USDT-M provenance, all 10 candle hashes, all funding hashes and zero-gap gate: PASS")
          PY
      - name: Replay four-symbol core at base costs
        run: |
          python scripts/research_15m_pullback_continuation.py \
            --signal-timeframe 15m --symbols BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT \
            --fee-bps 5 --spread-bps 1.25 --slippage-bps 2 --max-period VALIDATION \
            --out reports/15m_pullback/core4/screen_base
      - name: Replay four-symbol core at 1.5x costs
        run: |
          python scripts/research_15m_pullback_continuation.py \
            --signal-timeframe 15m --symbols BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT \
            --fee-bps 7.5 --spread-bps 1.875 --slippage-bps 3 --max-period VALIDATION \
            --out reports/15m_pullback/core4/screen_stress_1_5x
      - name: Replay HYPE separately at base costs
        run: |
          python scripts/research_15m_pullback_continuation.py \
            --signal-timeframe 15m --symbols HYPE-USDT \
            --fee-bps 5 --spread-bps 1.25 --slippage-bps 2 --max-period VALIDATION \
            --out reports/15m_pullback/hype/screen_base
      - name: Replay HYPE separately at 1.5x costs
        run: |
          python scripts/research_15m_pullback_continuation.py \
            --signal-timeframe 15m --symbols HYPE-USDT \
            --fee-bps 7.5 --spread-bps 1.875 --slippage-bps 3 --max-period VALIDATION \
            --out reports/15m_pullback/hype/screen_stress_1_5x
      - name: Screen 15m four-family router core at base costs
        run: |
          python scripts/research_adaptive_perp_portfolio.py \
            --signal-timeframe 15m --symbols BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT \
            --fee-bps 5 --spread-bps 1.25 --slippage-bps 2 --max-period VALIDATION \
            --out reports/15m_regimes/core4/screen_base
      - name: Screen 15m four-family router core at 1.5x costs
        run: |
          python scripts/research_adaptive_perp_portfolio.py \
            --signal-timeframe 15m --symbols BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT \
            --fee-bps 7.5 --spread-bps 1.875 --slippage-bps 3 --max-period VALIDATION \
            --out reports/15m_regimes/core4/screen_stress_1_5x
      - name: Screen 15m four-family router HYPE separately at base costs
        run: |
          python scripts/research_adaptive_perp_portfolio.py \
            --signal-timeframe 15m --symbols HYPE-USDT \
            --fee-bps 5 --spread-bps 1.25 --slippage-bps 2 --max-period VALIDATION \
            --out reports/15m_regimes/hype/screen_base
      - name: Screen 15m four-family router HYPE separately at 1.5x costs
        run: |
          python scripts/research_adaptive_perp_portfolio.py \
            --signal-timeframe 15m --symbols HYPE-USDT \
            --fee-bps 7.5 --spread-bps 1.875 --slippage-bps 3 --max-period VALIDATION \
            --out reports/15m_regimes/hype/screen_stress_1_5x
      - name: Independently replay each regime family at base and 1.5x costs
        run: |
          set -euo pipefail
          for family in COMPRESSION_BREAKOUT FALSE_BREAK_REVERSAL TREND_PULLBACK RANGE_REVERSION; do
            for cohort in core4 hype; do
              if [ "$cohort" = "core4" ]; then
                symbols="BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT"
              else
                symbols="HYPE-USDT"
              fi
              python scripts/research_adaptive_perp_portfolio.py \
                --signal-timeframe 15m --symbols "$symbols" --family-only "$family" \
                --fee-bps 5 --spread-bps 1.25 --slippage-bps 2 --max-period VALIDATION \
                --out "reports/15m_regimes/independent/$cohort/$family/base"
              python scripts/research_adaptive_perp_portfolio.py \
                --signal-timeframe 15m --symbols "$symbols" --family-only "$family" \
                --fee-bps 7.5 --spread-bps 1.875 --slippage-bps 3 --max-period VALIDATION \
                --out "reports/15m_regimes/independent/$cohort/$family/stress_1_5x"
            done
          done
      - name: Select only families with positive independent IS and validation edge
        id: module_gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          families = (
              "COMPRESSION_BREAKOUT",
              "FALSE_BREAK_REVERSAL",
              "TREND_PULLBACK",
              "RANGE_REVERSION",
          )
          minimum_trades = {"IS": 20, "VALIDATION": 10}
          decisions = {}
          eligible = []
          for family in families:
              paths = {
                  "base": Path(f"reports/15m_regimes/independent/core4/{family}/base/summary.json"),
                  "stress_1_5x": Path(
                      f"reports/15m_regimes/independent/core4/{family}/stress_1_5x/summary.json"
                  ),
              }
              reports = {}
              reasons = []
              for cost_case, path in paths.items():
                  if not path.exists():
                      reasons.append(f"{cost_case}: missing independent report")
                      continue
                  reports[cost_case] = json.loads(path.read_text())
              if len(reports) != 2:
                  decisions[family] = {"eligible": False, "reasons": reasons}
                  continue
              for period, minimum in minimum_trades.items():
                  for cost_case, report in reports.items():
                      metrics = report.get("by_period", {}).get(period)
                      if not metrics:
                          reasons.append(f"{cost_case}/{period}: no trades")
                          continue
                      trades = int(metrics.get("trades", 0))
                      pf = float(metrics.get("pf", 0))
                      expectancy = float(metrics.get("net_expectancy_pct", 0))
                      if trades < minimum:
                          reasons.append(f"{cost_case}/{period}: only {trades} trades; need {minimum}")
                      if pf < 1.0 or expectancy <= 0:
                          reasons.append(
                              f"{cost_case}/{period}: PF={pf:.3f}, net expectancy={expectancy:.5f}%"
                          )
              passed = not reasons
              if passed:
                  eligible.append(family)
              decisions[family] = {"eligible": passed, "reasons": reasons}
              print(f"{family}: {'ELIGIBLE' if passed else 'EXCLUDED'} {reasons}")
          result = {
              "selection_basis": "independent family-only replays; chronological IS and validation; base and 1.5x costs",
              "minimum_trades": minimum_trades,
              "eligible_families": eligible,
              "decisions": decisions,
              "router_behavior_when_empty": "NO_TRADE",
          }
          Path("reports/15m_regimes/module_selection.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"enabled_families={','.join(eligible) if eligible else 'NONE'}\n")
          print(f"Selected router families: {eligible or ['NONE / NO_TRADE']}")
          PY
      - name: Replay selected-family router at base and 1.5x costs
        env:
          ENABLED_FAMILIES: ${{ steps.module_gate.outputs.enabled_families }}
        run: |
          set -euo pipefail
          python scripts/research_adaptive_perp_portfolio.py \
            --signal-timeframe 15m --symbols BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT \
            --enabled-families "$ENABLED_FAMILIES" \
            --fee-bps 5 --spread-bps 1.25 --slippage-bps 2 --max-period VALIDATION \
            --out reports/15m_regimes/core4/screen_base_eligible
          python scripts/research_adaptive_perp_portfolio.py \
            --signal-timeframe 15m --symbols BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT \
            --enabled-families "$ENABLED_FAMILIES" \
            --fee-bps 7.5 --spread-bps 1.875 --slippage-bps 3 --max-period VALIDATION \
            --out reports/15m_regimes/core4/screen_stress_1_5x_eligible
      - name: Require 12-month BingX history and positive IS/validation before opening OOS
        id: research_gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selection_path = Path("reports/15m_regimes/module_selection.json")
          selection = json.loads(selection_path.read_text()) if selection_path.exists() else {}
          eligible_families = selection.get("eligible_families", [])
          candidates = {
              "pullback": (
                  Path("reports/15m_pullback/core4/screen_base/summary.json"),
                  Path("reports/15m_pullback/core4/screen_stress_1_5x/summary.json"),
              ),
              "regime": (
                  Path("reports/15m_regimes/core4/screen_base_eligible/summary.json"),
                  Path("reports/15m_regimes/core4/screen_stress_1_5x_eligible/summary.json"),
              ),
          }

          def qualifies(name, paths):
              if name == "regime" and not eligible_families:
                  return False, "no independent family passed IS/validation at base and 1.5x costs"
              base_path, stress_path = paths
              if not base_path.exists() or not stress_path.exists():
                  return False, "missing base/stress summary"
              base = json.loads(base_path.read_text())
              stress = json.loads(stress_path.read_text())
              coverage = base.get("common_signal_window", {})
              days = float(coverage.get("common_days", 0))
              if not coverage.get("covers_12_months") or days < 365:
                  return False, f"only {days:.2f} days of common BingX 15m candles; need >=365"
              for period in ("IS", "VALIDATION"):
                  for label, report in (("base", base), ("stress_1_5x", stress)):
                      metrics = report.get("by_period", {}).get(period)
                      if not metrics:
                          return False, f"{label}/{period}: no trades"
                      pf = float(metrics["pf"])
                      expectancy = float(metrics["net_expectancy_pct"])
                      if pf < 1.0 or expectancy <= 0:
                          return False, (
                              f"{label}/{period}: PF={pf:.3f}, "
                              f"net expectancy={expectancy:.5f}%"
                          )
              return True, "12-month coverage and positive IS/validation in base and stress"

          outcomes = {}
          for name, paths in candidates.items():
              passed, reason = qualifies(name, paths)
              outcomes[name] = passed
              print(f"{name}: {'OOS OPEN' if passed else 'OOS CLOSED'} — {reason}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for name, passed in outcomes.items():
                  handle.write(f"{name}_pass={'true' if passed else 'false'}\n")
          PY
      - name: Replay 15m pullback core OOS at base costs
        if: steps.research_gate.outputs.pullback_pass == 'true'
        run: |
          python scripts/research_15m_pullback_continuation.py \
            --signal-timeframe 15m --symbols BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT \
            --fee-bps 5 --spread-bps 1.25 --slippage-bps 2 --max-period OOS \
            --out reports/15m_pullback/core4/oos_base
      - name: Replay 15m pullback core OOS at 1.5x costs
        if: steps.research_gate.outputs.pullback_pass == 'true'
        run: |
          python scripts/research_15m_pullback_continuation.py \
            --signal-timeframe 15m --symbols BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT \
            --fee-bps 7.5 --spread-bps 1.875 --slippage-bps 3 --max-period OOS \
            --out reports/15m_pullback/core4/oos_stress_1_5x
      - name: Replay selected-family router core OOS at base costs
        if: steps.research_gate.outputs.regime_pass == 'true'
        env:
          ENABLED_FAMILIES: ${{ steps.module_gate.outputs.enabled_families }}
        run: |
          python scripts/research_adaptive_perp_portfolio.py \
            --signal-timeframe 15m --symbols BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT \
            --enabled-families "$ENABLED_FAMILIES" \
            --fee-bps 5 --spread-bps 1.25 --slippage-bps 2 --max-period OOS \
            --out reports/15m_regimes/core4/oos_base
      - name: Replay selected-family router core OOS at 1.5x costs
        if: steps.research_gate.outputs.regime_pass == 'true'
        env:
          ENABLED_FAMILIES: ${{ steps.module_gate.outputs.enabled_families }}
        run: |
          python scripts/research_adaptive_perp_portfolio.py \
            --signal-timeframe 15m --symbols BTC-USDT,ETH-USDT,SOL-USDT,INJ-USDT \
            --enabled-families "$ENABLED_FAMILIES" \
            --fee-bps 7.5 --spread-bps 1.875 --slippage-bps 3 --max-period OOS \
            --out reports/15m_regimes/core4/oos_stress_1_5x
      - name: Evaluate OOS promotion gates
        if: steps.research_gate.outputs.pullback_pass == 'true' || steps.research_gate.outputs.regime_pass == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          candidates = {
              "pullback": (
                  Path("reports/15m_pullback/core4/oos_base/summary.json"),
                  Path("reports/15m_pullback/core4/oos_stress_1_5x/summary.json"),
              ),
              "regime": (
                  Path("reports/15m_regimes/core4/oos_base/summary.json"),
                  Path("reports/15m_regimes/core4/oos_stress_1_5x/summary.json"),
              ),
          }
          results = {}
          for name, (base_path, stress_path) in candidates.items():
              if not base_path.exists() or not stress_path.exists():
                  continue
              base = json.loads(base_path.read_text())
              stress = json.loads(stress_path.read_text())
              bm = base.get("by_period", {}).get("OOS", {})
              sm = stress.get("by_period", {}).get("OOS", {})
              side_counts = {
                  side: sum(
                      int(value.get("trades", 0))
                      for key, value in base.get("by_symbol_side", {}).items()
                      if key.endswith("_" + side)
                  )
                  for side in ("LONG", "SHORT")
              }
              checks = {
                  "oos_trades": int(bm.get("trades", 0)) >= 100,
                  "base_pf": float(bm.get("pf", 0)) >= 1.25,
                  "base_expectancy": float(bm.get("net_expectancy_pct", 0)) > 0,
                  "positive_months": float(bm.get("positive_month_share_pct", 0)) >= 70,
                  "stress_pf": float(sm.get("pf", 0)) > 1.0,
                  "stress_expectancy": float(sm.get("net_expectancy_pct", 0)) > 0,
                  "base_drawdown_proxy": (
                      float(bm.get("realized_equal_notional_drawdown_pct", -999)) >= -10
                      and float(bm.get("trade_sequence_drawdown_pct", -999)) >= -20
                  ),
                  "stress_drawdown_proxy": (
                      float(sm.get("realized_equal_notional_drawdown_pct", -999)) >= -10
                      and float(sm.get("trade_sequence_drawdown_pct", -999)) >= -20
                  ),
                  "holding_time": (
                      bm.get("mean_hold_min") is not None
                      and float(bm["mean_hold_min"]) <= 90
                      and float(bm.get("median_hold_min", 999)) <= 60
                      and float(bm.get("max_hold_min", 999)) <= 540
                  ),
              }
              results[name] = {
                  "checks": checks,
                  "passed": all(checks.values()),
                  "oos_trades_by_side": side_counts,
                  "side_specific_claims_allowed": all(count >= 25 for count in side_counts.values()),
                  "base_oos": bm,
                  "stress_oos": sm,
              }
              print(
                  f"{name}: {'PASS — owner review/VST planning only' if all(checks.values()) else 'REJECT'}; "
                  f"checks={checks}; side_counts={side_counts}"
              )
          Path("reports/15m_promotion_gate.json").write_text(
              json.dumps(results, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload immutable 15m research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 15m-pullback-continuation-research
          path: |
            data/bingx_usdm/manifest.json
            data/bingx_usdm/funding_manifest.json
            data/bingx_usdm/*_15m.csv
            data/bingx_usdm/*_1h.csv
            data/bingx_usdm/funding_*.csv
            reports/15m_pullback/
            reports/15m_regimes/
            reports/bingx_public_history_probe.json
            reports/15m_promotion_gate.json
          if-no-files-found: warn
          retention-days: 90
