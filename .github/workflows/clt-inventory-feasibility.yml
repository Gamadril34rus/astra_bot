name: CLT historical inventory feasibility

on:
  workflow_dispatch:
  push:
    branches: [research/crowd-liquidity-trap]
    paths:
      - ".github/workflows/clt-inventory-feasibility.yml"
      - "scripts/research/clt_inventory_feasibility.py"
      - "tests/research/test_clt_inventory_feasibility.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: clt-inventory-feasibility
  cancel-in-progress: false

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install isolated test tools
        run: python -m pip install pytest ruff
      - name: Run CLT inventory unit tests
        run: python -m pytest tests/research/test_clt_inventory_feasibility.py -q --confcutdir=tests/research
      - name: Lint CLT inventory research files
        run: python -m ruff check scripts/research/clt_inventory_feasibility.py tests/research/test_clt_inventory_feasibility.py
      - name: Download public Hyperliquid leaderboard snapshot
        run: |
          mkdir -p manifest_evidence
          curl --fail --location --silent --show-error --retry 3 \
            https://stats-data.hyperliquid.xyz/Mainnet/leaderboard \
            -o manifest_evidence/leaderboard.json
          test -s manifest_evidence/leaderboard.json
      - name: Audit direction-aware historical inventory coverage
        run: |
          python scripts/research/clt_inventory_feasibility.py \
            --manifest manifest_evidence/leaderboard.json \
            --out-dir reports/clt_inventory_feasibility \
            --start 2026-10-03T00:00:00+00:00 \
            --end 2026-11-09T00:00:00+00:00 \
            --max-wallets 120
      - name: Upload aggregate-only feasibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clt-inventory-feasibility-${{ github.sha }}
          path: |
            reports/clt_inventory_feasibility/clt_inventory_15m.csv
            reports/clt_inventory_feasibility/clt_inventory_feasibility.json
          if-no-files-found: warn
          retention-days: 90
