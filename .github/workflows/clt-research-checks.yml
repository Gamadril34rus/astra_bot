name: CLT isolated research checks

on:
  push:
    branches: [research/crowd-liquidity-trap]
    paths:
      - "scripts/research/clt_event_model.py"
      - "scripts/research/clt_market_context.py"
      - "scripts/research/clt_inventory_feasibility.py"
      - "scripts/research/clt_bingx_market_data.py"
      - "tests/research/test_clt_event_model.py"
      - "tests/research/test_clt_market_context.py"
      - "tests/research/test_clt_inventory_feasibility.py"
      - "tests/research/test_clt_bingx_market_data.py"
      - ".github/workflows/clt-research-checks.yml"
  pull_request:
    branches: [master]
    paths:
      - "scripts/research/clt_event_model.py"
      - "scripts/research/clt_market_context.py"
      - "scripts/research/clt_inventory_feasibility.py"
      - "scripts/research/clt_bingx_market_data.py"
      - "tests/research/test_clt_event_model.py"
      - "tests/research/test_clt_market_context.py"
      - "tests/research/test_clt_inventory_feasibility.py"
      - "tests/research/test_clt_bingx_market_data.py"
      - ".github/workflows/clt-research-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clt-research-checks
  cancel-in-progress: true

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install isolated test tools
        run: python -m pip install pytest ruff
      - name: Run all CLT research unit tests
        run: |
          python -m pytest \
            tests/research/test_clt_event_model.py \
            tests/research/test_clt_market_context.py \
            tests/research/test_clt_inventory_feasibility.py \
            tests/research/test_clt_bingx_market_data.py \
            -q --confcutdir=tests/research
      - name: Lint all CLT research files
        run: |
          python -m ruff check \
            scripts/research/clt_event_model.py \
            scripts/research/clt_market_context.py \
            scripts/research/clt_inventory_feasibility.py \
            scripts/research/clt_bingx_market_data.py \
            tests/research/test_clt_event_model.py \
            tests/research/test_clt_market_context.py \
            tests/research/test_clt_inventory_feasibility.py \
            tests/research/test_clt_bingx_market_data.py
