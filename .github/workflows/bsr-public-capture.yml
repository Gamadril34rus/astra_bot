name: BSR public market-data capture

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Capture duration (300-3600 seconds)"
        required: true
        default: "3600"
        type: string

permissions:
  contents: read

concurrency:
  group: bsr-public-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Capture public BingX and Binance feeds
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Validate duration
        shell: bash
        run: |
          python - <<'PY'
          value = int("${{ inputs.duration_seconds }}")
          if not 300 <= value <= 3600:
              raise SystemExit("duration_seconds must be between 300 and 3600")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install recorder dependency
        run: python -m pip install "aiohttp>=3.9"
      - name: Capture public market data
        run: |
          python scripts/bsr_capture.py \
            --symbols BTC-USDT ETH-USDT SOL-USDT HYPE-USDT INJ-USDT \
            --output data/bsr/bingx_market.jsonl \
            --duration-seconds "${{ inputs.duration_seconds }}"
      - name: Audit raw capture
        if: always()
        run: |
          if [ -f data/bsr/bingx_market.jsonl ] && [ -f data/bsr/bingx_market_binance_spot.jsonl ]; then
            python scripts/bsr_audit.py \
              --bingx data/bsr/bingx_market.jsonl \
              --binance data/bsr/bingx_market_binance_spot.jsonl \
              --output data/bsr/capture_audit.json
          else
            echo "Capture files missing; recording explicit incomplete-run report."
            mkdir -p data/bsr
            printf '{"ready_for_downstream_filtering":false,"reason":"missing_capture_file"}\n' > data/bsr/capture_audit.json
          fi
      - name: Upload immutable research artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bsr-public-capture-${{ github.run_id }}
          path: data/bsr/
          if-no-files-found: error
          retention-days: 14
