name: OKX public market history research probe

on:
  push:
    branches: [research/4h-pullback-continuation]
    paths:
      - "scripts/probe_okx_public_history.py"
      - "tests/unit/test_probe_okx_public_history.py"
      - ".github/workflows/okx-public-history-probe.yml"
  workflow_dispatch:
    inputs:
      month:
        description: "OKX UTC+8 archive month (YYYY-MM)"
        type: string
        default: "2026-10"
        required: true

permissions:
  contents: read

concurrency:
  group: okx-public-history-research
  cancel-in-progress: false

jobs:
  public-history-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Run isolated tests
        run: |
          python -m pytest tests/unit/test_probe_okx_public_history.py -q --confcutdir=tests/unit
          python -m ruff check --config pyproject.toml scripts/probe_okx_public_history.py tests/unit/test_probe_okx_public_history.py
      - name: Download and validate one month of public OKX swap history
        env:
          OKX_PROBE_MONTH: ${{ inputs.month || '2026-10' }}
        run: |
          python scripts/probe_okx_public_history.py --month "$OKX_PROBE_MONTH"
      - name: Upload immutable OKX probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-public-history-probe
          path: reports/okx_public_history_probe/
          if-no-files-found: warn
          retention-days: 90
