name: OKX public market history research probe

on:
  push:
    branches: [research/4h-pullback-continuation]
    paths:
      - "scripts/probe_okx_public_history.py"
      - "tests/unit/test_probe_okx_public_history.py"
      - "scripts/build_okx_backtest_dataset.py"
      - "tests/unit/test_build_okx_backtest_dataset.py"
      - "scripts/research_15m_pullback_continuation.py"
      - "scripts/research_adaptive_perp_portfolio.py"
      - "tests/unit/test_research_adaptive_perp_portfolio.py"
      - ".github/workflows/okx-public-history-probe.yml"
  workflow_dispatch:
    inputs:
      start_month:
        description: "First OKX UTC+8 archive month, inclusive (YYYY-MM)"
        type: string
        default: "2025-11"
        required: true
      end_month:
        description: "Last OKX UTC+8 archive month, inclusive (YYYY-MM)"
        type: string
        default: "2026-10"
        required: true

permissions:
  contents: read

concurrency:
  group: okx-public-history-research
  cancel-in-progress: false

jobs:
  public-history-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff numpy pandas
      - name: Run isolated tests
        run: |
          python -m pytest tests/unit/test_probe_okx_public_history.py tests/unit/test_build_okx_backtest_dataset.py -q --confcutdir=tests/unit
          python -m ruff check --config pyproject.toml scripts/probe_okx_public_history.py scripts/build_okx_backtest_dataset.py tests/unit/test_probe_okx_public_history.py tests/unit/test_build_okx_backtest_dataset.py
      - name: Download and validate 12 months of public OKX swap history
        env:
          OKX_START_MONTH: ${{ inputs.start_month || '2025-11' }}
          OKX_END_MONTH: ${{ inputs.end_month || '2026-10' }}
        run: |
          python scripts/probe_okx_public_history.py --start-month "$OKX_START_MONTH" --end-month "$OKX_END_MONTH"
      - name: Build strict 15m/1h and settled-funding backtest dataset
        run: |
          python scripts/build_okx_backtest_dataset.py --source-dir reports/okx_public_history_probe --out-dir data/okx_usdm
      - name: Run 15m pullback on OKX at base execution costs
        run: |
          python scripts/research_15m_pullback_continuation.py \
            --data-dir data/okx_usdm \
            --signal-timeframe 15m \
            --symbols BTC-USDT,ETH-USDT,SOL-USDT,HYPE-USDT,INJ-USDT \
            --fee-bps 5 --spread-bps 2 --slippage-bps 3 \
            --max-period ALL \
            --out reports/okx_15m_pullback_base
      - name: Run same frozen rules at 1.5x execution costs
        run: |
          python scripts/research_15m_pullback_continuation.py \
            --data-dir data/okx_usdm \
            --signal-timeframe 15m \
            --symbols BTC-USDT,ETH-USDT,SOL-USDT,HYPE-USDT,INJ-USDT \
            --fee-bps 7.5 --spread-bps 3 --slippage-bps 4.5 \
            --max-period ALL \
            --out reports/okx_15m_pullback_stress
      - name: Upload immutable OKX probe and replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-public-history-and-replay
          path: |
            reports/okx_public_history_probe/
            data/okx_usdm/
            reports/okx_15m_pullback_base/
            reports/okx_15m_pullback_stress/
          if-no-files-found: warn
          retention-days: 90
