name: Ruff autofix for isolated research files

on:
  push:
    branches:
      - "research/4h-pullback-continuation"
    paths:
      - ".github/workflows/ruff-autofix-research.yml"

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Apply Ruff import fixes
        run: |
          python -m ruff check --fix scripts/collect_ironflow_wallet_archive.py scripts/analyze_ironflow_wallet_flow.py tests/unit/test_collect_ironflow_wallet_archive.py tests/unit/test_analyze_ironflow_wallet_flow.py
          python -m ruff check scripts/collect_ironflow_wallet_archive.py scripts/analyze_ironflow_wallet_flow.py tests/unit/test_collect_ironflow_wallet_archive.py tests/unit/test_analyze_ironflow_wallet_flow.py
      - name: Commit isolated research lint fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/collect_ironflow_wallet_archive.py scripts/analyze_ironflow_wallet_flow.py tests/unit/test_collect_ironflow_wallet_archive.py tests/unit/test_analyze_ironflow_wallet_flow.py
            git commit -m "style(research): apply Ruff fixes to wallet research"
            git push
          fi
      - name: Upload fixed files
        uses: actions/upload-artifact@v4
        with:
          name: ruff-fixed-ironflow-files
          path: |
            scripts/collect_ironflow_wallet_archive.py
            tests/unit/test_collect_ironflow_wallet_archive.py
            scripts/analyze_ironflow_wallet_flow.py
            tests/unit/test_analyze_ironflow_wallet_flow.py
          retention-days: 7
