name: BingX 1m history depth probe for 15m aggregation

on:
  push:
    branches: [research/4h-pullback-continuation]
    paths:
      - "scripts/probe_bingx_1m_depth.py"
      - "tests/research/test_bingx_1m_depth_probe.py"
      - ".github/workflows/bingx-1m-depth-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bingx-1m-depth-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run probe unit tests
        run: python -m pytest tests/research/test_bingx_1m_depth_probe.py -q --confcutdir=tests/research
      - name: Probe actual BingX swap kline history and optional fields
        run: python scripts/probe_bingx_1m_depth.py --out reports/bingx_1m_depth_probe.json
      - name: Upload immutable depth evidence
        uses: actions/upload-artifact@v4
        with:
          name: bingx-1m-depth-probe
          path: reports/bingx_1m_depth_probe.json
          if-no-files-found: error
          retention-days: 90
