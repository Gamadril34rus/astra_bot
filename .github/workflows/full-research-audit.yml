name: Full Research Audit 2026

on:
  schedule:
    - cron: '0 2 * * 1'  # Каждое воскресенье/понедельник в 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-research-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Real Public OHLCV Data
        run: |
          python scripts/fetch_klines.py --symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT --timeframes 1h,4h,1d --start 2021-01-01 --end 2026-08-22

      - name: Run Unified Research Audit
        run: |
          python scripts/run_full_research_audit.py --data-dir data --symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT --start 2021-01-01 --oos-start 2025-01-01 --end 2026-08-22 --out reports/research_2026

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-research-audit-2026-reports
          path: reports/research_2026/
