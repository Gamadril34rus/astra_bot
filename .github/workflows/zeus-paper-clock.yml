name: Zeus paper-clock

# Paper-only Zeus 4h wedge. ~30 liquid USDT pairs.
# Live / settings.yaml not touched.

on:
  workflow_dispatch:

concurrency:
  group: zeus-paper-clock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Restore state
        run: |
          git config user.name "astra-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --no-rebase origin master

      - name: Write .env (paper only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          {
            echo "ENVIRONMENT=paper"
            echo "PAPER_TRADING=true"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_ADMIN_ID=$TELEGRAM_ADMIN_ID"
          } > .env
          chmod 600 .env
          grep -q 'ENVIRONMENT=paper' .env
          grep -q 'PAPER_TRADING=true' .env

      - name: Zeus paper-clock --once multi-symbol
        run: python scripts/run_paper_zeus.py --once --symbols BTC-USDT,ETH-USDT,SOL-USDT
        continue-on-error: true

      - name: Telegram status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python scripts/zeus_telegram_status.py --journal models/zeus_trade_journal.jsonl
        continue-on-error: true

      - name: Save Zeus state
        if: always()
        run: |
          for f in \
            models/zeus_trade_journal.jsonl \
            models/zeus_tg_notify_state.json \
            models/zeus_paper_positions.json \
            models/zeus_paper_trades.jsonl \
            models/zeus_strategy_stats.json \
            models/zeus_no_trade_observations.jsonl \
            models/zeus_halt_alerts.json \
            models/zeus_symbol_loss_guard.json \
            models/zeus_no_trade_outcomes.jsonl \
            models/zeus_pattern_exit_shadow.jsonl \
            models/zeus_wedge_1h_signals.jsonl \
            models/zeus_wedge_1h_shadow_state.json \
            models/zeus_hypotheses.json \
            models/zeus_heat_state.json \
            models/zeus_tier_audit.json \
            models/zeus_vol_cooldowns.json \
            models/zeus_vol_cooldown_events.jsonl
          do
            [ -f "$f" ] && git add -f "$f" || true
          done
          git diff --cached --quiet || \
            git commit -m "chore(ci): zeus paper state $(date -u +%Y-%m-%dT%H:%MZ)"
          ok=0
          for i in 1 2 3 4 5 6; do
            git fetch origin master
            if git push origin master; then ok=1; break; fi
            git rebase --autostash origin/master || { git rebase --abort || true; break; }
            sleep $((10 + RANDOM % 20))
          done
          if [ "$ok" != "1" ]; then
            echo "Save Zeus state: push failed after retries" >&2
            exit 1
          fi
