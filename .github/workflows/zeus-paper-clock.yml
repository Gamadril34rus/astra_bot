name: Zeus paper-clock

# Paper-only Zeus 4h wedge. ~30 liquid USDT pairs.
# Live / settings.yaml not touched.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: zeus-paper-clock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Restore state
        run: |
          git config user.name "astra-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --no-rebase origin master

      - name: Write .env (paper only)
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          {
            echo "ENVIRONMENT=paper"
            echo "PAPER_TRADING=true"
            echo "BINGX_API_KEY=$BINGX_API_KEY"
            echo "BINGX_API_SECRET=$BINGX_API_SECRET"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_ADMIN_ID=$TELEGRAM_ADMIN_ID"
          } > .env
          chmod 600 .env
          grep -q 'ENVIRONMENT=paper' .env
          grep -q 'PAPER_TRADING=true' .env

      - name: Zeus paper-clock --once multi-symbol
        run: python scripts/run_paper_zeus.py --once --symbols BTC-USDT,ETH-USDT,SOL-USDT,BNB-USDT,XRP-USDT,DOGE-USDT,ADA-USDT,AVAX-USDT,DOT-USDT,LINK-USDT,LTC-USDT,BCH-USDT,NEAR-USDT,APT-USDT,SUI-USDT,ARB-USDT,OP-USDT,UNI-USDT,AAVE-USDT,FIL-USDT,ATOM-USDT,INJ-USDT,TIA-USDT,WLD-USDT,TAO-USDT,HYPE-USDT,1000PEPE-USDT,WIF-USDT,ENA-USDT,PENDLE-USDT,TRX-USDT --journal models/zeus_trade_journal.jsonl
        continue-on-error: true

      - name: Telegram status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python scripts/zeus_telegram_status.py --journal models/zeus_trade_journal.jsonl
        continue-on-error: true

      - name: State size gate (TZ §29)
        if: ${{ !cancelled() }}
        run: python scripts/check_state_size.py --root models

      - name: Save Zeus state
        if: always()
        run: |
          for f in \
            models/zeus_trade_journal.jsonl \
            models/zeus_tg_notify_state.json \
            models/zeus_paper_positions.json \
            models/zeus_paper_trades.jsonl \
            models/zeus_strategy_stats.json \
            models/zeus_no_trade_observations.jsonl \
            models/zeus_halt_alerts.json \
            models/zeus_symbol_loss_guard.json \
            models/zeus_no_trade_outcomes.json \
            models/zeus_pattern_exit_shadow.jsonl \
            models/zeus_wedge_1h_signals.jsonl \
            models/zeus_wedge_1h_shadow_state.json \
            models/zeus_hypotheses.json \
            models/zeus_heat_state.json \
            models/zeus_tier_audit.json
          do
            [ -f "$f" ] && git add -f "$f" || true
          done
          git diff --cached --quiet || \
            git commit -m "chore(ci): zeus paper state $(date -u +%Y-%m-%dT%H:%MZ)"
          ok=0
          push_log=""
          for i in 1 2 3 4 5 6; do
            git fetch origin master
            if push_out=$(git push origin master 2>&1); then
              ok=1
              break
            fi
            push_log="$push_out"
            git rebase --autostash origin/master || { git rebase --abort || true; break; }
            sleep $((10 + RANDOM % 20))
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: git push origin master rejected after retries"
            printf '%s\n' "$push_log" | tail -n 5
            exit 1
          fi
