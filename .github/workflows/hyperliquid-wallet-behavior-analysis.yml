name: Hyperliquid wallet behaviour analysis

on:
  push:
    branches:
      - "research/4h-pullback-continuation"
    paths:
      - "scripts/analyze_ironflow_wallet_behavior.py"
      - "tests/unit/test_analyze_ironflow_wallet_behavior.py"
      - ".github/workflows/hyperliquid-wallet-behavior-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hyperliquid-wallet-behaviour-analysis
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pytest ruff
      - name: Run analysis tests and lint
        run: |
          python -m pytest tests/unit/test_analyze_ironflow_wallet_behavior.py -q --confcutdir=tests/unit
          python -m ruff check --config pyproject.toml scripts/analyze_ironflow_wallet_behavior.py tests/unit/test_analyze_ironflow_wallet_behavior.py
      - name: Download frozen 37-day wallet trade evidence
        uses: actions/download-artifact@v4
        with:
          name: hyperliquid-wallet-archive-research
          run-id: 43246676924
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: archive_input
      - name: Locate and analyse wallet trade tape
        run: |
          TRADE_FILE="$(find archive_input -name 'wallet_trades.parquet' -type f | head -n 1)"
          MANIFEST_FILE="$(find archive_input -name 'wallet_archive_manifest.json' -type f | head -n 1)"
          test -n "$TRADE_FILE"
          test -n "$MANIFEST_FILE"
          python scripts/analyze_ironflow_wallet_behavior.py \
            --input "$TRADE_FILE" \
            --manifest "$MANIFEST_FILE" \
            --out-dir reports/hyperliquid_wallet_behavior
      - name: Upload wallet behaviour analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-wallet-behaviour-analysis
          path: reports/hyperliquid_wallet_behavior/
          if-no-files-found: warn
          retention-days: 90
