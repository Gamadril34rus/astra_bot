name: zeus-live-clock

# MANUAL ONLY — no schedule. Secrets never echoed.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "dry tick (reconcile+commands, no entries)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  live-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -q -r requirements.txt || pip install -q aiohttp python-dotenv
      - name: Guard flags
        env:
          ZEUS_LIVE: ${{ secrets.ZEUS_LIVE }}
        run: |
          if [ "${ZEUS_LIVE}" != "1" ]; then
            echo "ZEUS_LIVE is not 1 — abort (adapter inactive)"
            exit 0
          fi
      - name: TG commands poll
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set +x
          python -m astra_bot.decision.tg_live_commands --timeout 25
      - name: Run live clock
        env:
          ZEUS_LIVE: ${{ secrets.ZEUS_LIVE }}
          ZEUS_VST: ${{ secrets.ZEUS_VST }}
          ZEUS_MAINNET: ${{ secrets.ZEUS_MAINNET }}
          ENVIRONMENT: live
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
        run: |
          # never print secrets
          set +x
          DRY_FLAG=""
          if [ "${{ inputs.dry }}" = "true" ]; then DRY_FLAG="--dry"; fi
          python scripts/zeus_live_clock.py $DRY_FLAG
      - name: Save live commands state
        if: always()
        run: |
          git config user.name "astra-bot" || true
          git config user.email "bot@users.noreply.github.com" || true
          F=models/zeus_live_commands.json
          if [ -f "$F" ] && ! git diff --quiet -- "$F"; then
            git add -f "$F"
            git commit -m "live: commands state (auto)"
            for i in 1 2 3 4 5; do
              git fetch origin "${{ github.ref_name }}"
              if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
              sleep 5
            done
          fi
