name: zeus-live-clock

# MANUAL ONLY — no schedule. Secrets never echoed.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "dry tick (reconcile+commands, no entries)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zeus-live-clock
  cancel-in-progress: false

jobs:
  live-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -q -r requirements.txt
      - name: Guard flags
        env:
          ZEUS_LIVE: ${{ secrets.ZEUS_LIVE }}
        run: |
          if [ "${ZEUS_LIVE}" != "1" ]; then
            echo "ZEUS_LIVE is not 1 — abort (adapter inactive)"
            exit 0
          fi
      - name: TG commands poll
        env:
          TELEGRAM_LIVE_BOT_TOKEN: ${{ secrets.TELEGRAM_LIVE_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_LIVE_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +x
          if [ -z "${TELEGRAM_LIVE_BOT_TOKEN}" ]; then
            echo "TELEGRAM_LIVE_BOT_TOKEN is required for live TG poll" >&2
            exit 1
          fi
          python -m astra_bot.decision.tg_live_commands --timeout 25 --menu
      - name: Run live clock
        env:
          ZEUS_LIVE: ${{ secrets.ZEUS_LIVE }}
          ZEUS_VST: ${{ secrets.ZEUS_VST }}
          ZEUS_MAINNET: ${{ secrets.ZEUS_MAINNET }}
          ZEUS_ARM: ${{ secrets.ZEUS_ARM }}
          ZEUS_LIVE_FORCE_LEVERAGE: "6"
          ZEUS_KILL_PF_WINDOW: "20"
          ZEUS_LIVE_MAX_LEVERAGE: "10"
          ZEUS_LIVE_EXIT_ENGINE: "on"
          ZEUS_LIVE_TRAIL_POLICY: "atr"
          ZEUS_BE_TRIGGER_R: "0.5"
          ZEUS_TP1_RR: "0.6"
          ZEUS_STOP_PULL_PCT: "0"
          ENVIRONMENT: live
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          TELEGRAM_LIVE_BOT_TOKEN: ${{ secrets.TELEGRAM_LIVE_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_LIVE_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TEST: ${{ secrets.TG_TEST }}
        run: |
          # never print secrets
          set +x
          DRY_FLAG=""
          if [ "${{ inputs.dry }}" = "true" ]; then DRY_FLAG="--dry"; fi
          python scripts/zeus_live_clock.py $DRY_FLAG
      - name: Save live commands state
        env:
          TELEGRAM_LIVE_BOT_TOKEN: ${{ secrets.TELEGRAM_LIVE_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        if: always()
        run: |
          set +e
          git config user.name "astra-bot" || true
          git config user.email "bot@users.noreply.github.com" || true
          SAVE_LIST="models/zeus_live_commands.json models/zeus_live_tg_offset.json
            models/zeus_live_income_tape_seen.json models/zeus_live_menu_pushed.json models/zeus_live_tg_http_warn.json models/zeus_live_v2_warn.json models/zeus_kill_epoch.json models/zeus_pf_window_reset.json models/zeus_week_loss_reset.json models/zeus_protect_bare_ticks.json models/zeus_tp_heal_state.json models/zeus_pos_missing_warn.json models/zeus_ghost_position_warn.json models/zeus_be_pending.json models/zeus_live_entries.jsonl models/zeus_live_positions.json models/zeus_live_equity.json models/zeus_live_trades.jsonl models/zeus_heat_state.json models/zeus_live_tg_flags.json models/zeus_live_journal.jsonl models/zeus_arm_pending.jsonl models/zeus_arm_margin_fails.json models/zeus_live_cooldown.json models/kill_switch_state.json models/zeus_live_blocked.json models/zeus_vol_cooldowns.json models/zeus_vol_cooldown_events.jsonl models/zeus_live_digest.json models/zeus_live_stop_log.jsonl models/zeus_live_tg_pending.json models/zeus_funding_tg_state.json models/zeus_funding_day.json"
          stage_save() {
            for F in $SAVE_LIST; do
              if [ -f "$F" ]; then
                git add -f "$F" || true
              elif git ls-files --error-unmatch "$F" >/dev/null 2>&1; then
                git rm --cached -q "$F" || true
              fi
            done
          }
          # Capture tick state from disk FIRST (never reset --hard before this)
          stage_save
          # F6.2: monotonic offset vs origin (never rewind watermark)
          git fetch origin "${{ github.ref_name }}" 2>/dev/null || true
          python3 scripts/monotonic_tg_offset.py origin "origin/${{ github.ref_name }}" || true
          stage_save
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "live: commands/entries/positions state (auto)" || true
          fi
          ok=0
          last_err=""
          for i in 1 2 3 4 5; do
            echo "save attempt $i/5"
            # Drop unstaged noise so rebase can run (root 22.10: cannot rebase unstaged)
            git reset --hard HEAD >/dev/null 2>&1 || true
            if ! git fetch origin "${{ github.ref_name }}" 2>/tmp/fetch_err.txt; then
              last_err="fetch: $(tr '\n' ' ' </tmp/fetch_err.txt | head -c 200)"
              echo "$last_err"
              sleep 5
              continue
            fi
            if ! git rebase "origin/${{ github.ref_name }}" 2>/tmp/rebase_err.txt; then
              cat /tmp/rebase_err.txt || true
              for F in $SAVE_LIST; do
                if [ "$F" = "models/zeus_live_tg_offset.json" ]; then
                  python3 scripts/monotonic_tg_offset.py conflict || true
                  git add -f "$F" 2>/dev/null || true
                else
                  git checkout --ours -- "$F" 2>/dev/null || true
                  git add -f "$F" 2>/dev/null || true
                fi
              done
              if ! git -c core.editor=true rebase --continue 2>/tmp/rebase_cont.txt; then
                cat /tmp/rebase_cont.txt || true
                git rebase --abort 2>/dev/null || true
                last_err="rebase: $(tr '\n' ' ' </tmp/rebase_err.txt | head -c 200)"
                echo "$last_err"
                sleep 5
                continue
              fi
            fi
            if git push origin "HEAD:${{ github.ref_name }}" 2>/tmp/push_err.txt; then
              ok=1
              rm -f models/zeus_live_v2_warn.json
              break
            fi
            last_err="push: $(tr '\n' ' ' </tmp/push_err.txt | head -c 200)"
            echo "push failed attempt $i: $last_err"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "save lost race after 5 pushes — failing run (V2) last=$last_err" >&2
            WARN_FILE=models/zeus_live_v2_warn.json
            send_warn=1
            if [ -f "$WARN_FILE" ]; then
              prev=$(python3 -c "import json,time; d=json.load(open('$WARN_FILE')); print(int(time.time()-float(d.get('ts') or 0)))" 2>/dev/null || echo 99999)
              if [ "$prev" -lt 3600 ]; then send_warn=0; fi
            fi
            TOKEN="${TELEGRAM_LIVE_BOT_TOKEN:-}"
            CHAT="${TELEGRAM_CHAT_ID:-${TELEGRAM_ADMIN_ID:-}}"
            if [ "$send_warn" = "1" ] && [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
              curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT}" \
                --data-urlencode "text=⚠️ live-clock: сохранение состояния в git не удалось 5 раз — журнал под угрозой" \
                >/dev/null 2>&1 || true
              python3 -c "import json,time; open('$WARN_FILE','w').write(json.dumps({'ts': time.time()}))" 2>/dev/null || true
            fi
            exit 1
          fi
