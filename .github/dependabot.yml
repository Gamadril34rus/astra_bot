version: 2
# Owner 26.10: monthly, limit 3, ignore intentional pins (ccxt never without owner word).
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    ignore:
      # Exchange pin — слово владельца / F4 hedge-safe; не поднимать без отдельного слова
      - dependency-name: "ccxt"
      # Keep upper bound discipline if present in requirements
      - dependency-name: "numpy"
        versions: [">=3"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
