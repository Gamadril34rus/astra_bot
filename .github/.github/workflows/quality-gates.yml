name: Quality gates (TZ §35)

# Quality > скорость: каждый push/PR проходит полный тест-гейт ДО того,
# как код попадает в live-контур. TZ §35: pytest + ruff + imports +
# integration + state-size gate.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: для diff по изменённым файлам (ruff-гейт).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests (unit + integration, TZ §33/§34)
        run: |
          python -m pytest tests -q --maxfail=1

      - name: "Ruff: new/changed files"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE=$(git rev-parse "origin/${GITHUB_REF_NAME}~1" 2>/dev/null || echo "")
          fi
          if [ -z "${BASE}" ]; then
            echo "Нет базовой ревизии — ruff пропущен"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${BASE}" -- \
            'astra_bot/**/*.py' 'tests/**/*.py' 'scripts/**/*.py' || true)
          if [ -z "${CHANGED}" ]; then
            echo "Python-файлы не изменились — ruff пропущен"
          else
            echo "${CHANGED}"
            echo "${CHANGED}" | xargs -d '\n' python -m ruff check
          fi

      - name: Import smoke (стеки импортируются)
        run: |
          python -c "import astra_bot.decision.trading_engine, astra_bot.decision.exit_controller, astra_bot.decision.meta_strategy, astra_bot.ml.hypothesis_engine, astra_bot.ml.exit_research, astra_bot.ml.research_memory, astra_bot.ml.model_registry, astra_bot.core.state_rotation; print('imports OK')"

      - name: "State size gate (TZ §29, рост ограничен)"
        run: |
          python scripts/check_state_size.py --root models
