previews:
  generation: automatic

services:
  # Background Worker — бот
  - type: worker
    name: astra-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m astra_bot.main --env paper
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astra-db
          property: connectionString
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_USER_ID
        sync: false
      - key: PAPER_TRADING
        value: "true"
      - key: ENVIRONMENT
        value: "paper"
      - key: LOG_LEVEL
        value: "INFO"

  # Cron Job — ежедневный отчёт (без plan)
  - type: cron
    name: daily-report
    runtime: python
    schedule: "0 9 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/daily_report.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astra-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_USER_ID
        sync: false

databases:
  - name: astra-db
    databaseName: astra_bot
    user: astra
    plan: free
