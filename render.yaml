previews:
  generation: automatic

services:
  # Основной бот — Web Service
  - type: web
    name: astra-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Web-режим живёт в корневом main.py (FastAPI app + /health, /tick, /status).
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astra-db
          property: connectionString
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_USER_ID
        sync: false
      - key: PAPER_TRADING
        value: "true"
      - key: ENVIRONMENT
        value: "paper"
      - key: RENDER_WEB
        value: "true"
      - key: PORT
        value: "8000"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_DIR
        value: "/tmp/logs"

  # Ежедневный отчёт — Cron Job
  - type: cron
    name: daily-report
    runtime: python
    schedule: "0 9 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/daily_report.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astra-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_USER_ID
        sync: false

databases:
  - name: astra-db
    databaseName: astra_bot
    user: astra
    plan: free
