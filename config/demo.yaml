# ASTRA BOT — Demo/Paper Trading Configuration
# ============================================================
# Конфигурация для тестирования на демо-счёте OKX
# ============================================================

system:
  name: "ASTRA BOT"
  version: "1.0.0"
  environment: "paper"  # development | paper | production
  paper_trading: true
  trading_enabled: true  # Разрешаем торговлю в paper режиме

# ============================================================
# РЫНОЧНЫЕ ДАННЫЕ
# ============================================================
market_data:
  poll_interval_ms: 1000  # Медленнее для тестирования
  websocket_reconnect_delay: 3
  stale_data_timeout_seconds: 5
  candle_timeframes:
    - "1m"
    - "5m"
    - "15m"
  max_candles_cache: 10000
  orderbook_depth: 25

# ============================================================
# УНИВЕРСУМ ИНСТРУМЕНТОВ
# ============================================================
trading:
  instruments:
    - "BTC-USDT"
    - "ETH-USDT"

  strategies:
    momentum:
      enabled: true
      weight: 1.0
    mean_reversion:
      enabled: true
      weight: 1.0

  strategy_params:
    momentum:
      ema_short: 20
      ema_medium: 50
      ema_long: 200
      atr_stop_multiplier: 1.5
      volume_ratio_threshold: 1.5
      min_risk_reward: 1.5

    mean_reversion:
      bb_period: 20
      bb_std_dev: 2.0
      rsi_oversold: 30
      rsi_overbought: 70
      zscore_threshold: 2.0

# ============================================================
# РИСК-ПАРАМЕТРЫ (ДЛЯ DEMO)
# ============================================================
risk:
  risk_per_trade: 0.01  # 1% от капитала (для тестирования)
  daily_loss_limit: 0.05    # 5%
  weekly_loss_limit: 0.10   # 10%
  soft_drawdown: 0.10
  hard_drawdown: 0.15
  emergency_drawdown: 0.20
  max_exposure_pct: 0.50
  max_open_positions: 3
  high_volatility_multiplier: 0.5
  extreme_volatility_threshold: 0.15
  volatility_lookback: 20
  correlation_limit: 0.7

  drawdown_adaptation:
    - drawdown: 0
      risk_multiplier: 1.0
    - drawdown: 0.05
      risk_multiplier: 0.75
    - drawdown: 0.10
      risk_multiplier: 0.5

# ============================================================
# ML НАСТРОЙКИ
# ============================================================
ml:
  enabled: true
  model_type: "lightgbm"
  model_path: "models/demo/"
  model_version: "DEMO-20260831"
  auto_train: false
  auto_deploy: false
  retraining_interval_days: 7
  min_training_samples: 100
  train_split: 0.7
  validation_split: 0.15
  min_probability: 0.55
  min_confidence: 0.3

# ============================================================
# TELEGRAM (опционально для demo)
# ============================================================
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN:-}"
  allowed_user_ids:
    - "${TELEGRAM_USER_ID:-}"
  enable_alerts: false

# ============================================================
# БИРЖИ - DEMO РЕЖИМ
# ============================================================
exchanges:
  okx:
    enabled: true
    sandbox: true  # DEMO РЕЖИМ!
    api_key: "${OKX_API_KEY}"
    api_secret: "${OKX_API_SECRET}"
    passphrase: "${OKX_PASSPHRASE}"
    contract_type: "spot"
    base_url: "https://www.okx.com"

    trading_pairs:
      - "BTC-USDT"
      - "ETH-USDT"

    max_orders_per_minute: 20
    max_orders_per_day: 200

# ============================================================
# МОНИТОРИНГ
# ============================================================
monitoring:
  enable_metrics: true
  metrics_port: 8000
  log_level: "DEBUG"
  log_file: "/tmp/astra_demo.log"

# ============================================================
# ПРИОРИТЕТНЫЕ ДВИЖКИ (NEW)
# ============================================================
priority_engines:
  microstructure_flow:
    enabled: true
    window_size: 1000
    thresholds:
      imbalance_threshold: 0.1
      velocity_threshold: 2.0
      absorption_threshold: 0.5
      spoofing_min_size: 50.0

  liquidity_map:
    enabled: true
    sweep_detection: true
    zone_classification: true

  liquidation_cascade:
    enabled: true
    cascade_min_events: 3
    cascade_cooldown: 300

  portfolio_allocator:
    enabled: true
    allocation_method: "sharpe_maximization"
    max_portfolio_risk: 0.05
    correlation_threshold: 0.7
