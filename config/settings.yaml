# ASTRA BOT — Configuration
# ---------------
# КРИТИЧЕСКИ ВАЖНО: Никогда не храните реальные ключи в этом файле!
# Используйте переменные окружения для sensitive данных.

system:
  name: "ASTRA BOT"
  version: "0.1.0"
  environment: "development"  # development | paper | production
  paper_trading: true
  trading_enabled: false  # Включить только после полной валидации

# Рыночные данные
market_data:
  poll_interval_ms: 1000
  websocket_reconnect_delay: 5
  stale_data_timeout_seconds: 5
  candle_timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "1h"
    - "4h"
    - "1d"
  max_candles_cache: 10000
  orderbook_depth: 20

# Универсум инструментов
trading:
  instruments:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  
  # Стратегии
  strategies:
    momentum:
      enabled: true
      weight: 1.0
    mean_reversion:
      enabled: true
      weight: 1.0
    book_breakout:
      enabled: true  # «Простая книга торговли»: пробой → ретест → подтверждение
      weight: 1.0
    ts_momentum:
      # Флипы по 45-дневному импульсу (проверено на истории BTC/USDT 1h/4h,
      # scripts/research_free_strategies.py). Подключено в decision-движке
      # (scripts/run_bot.py / run_paper.py), оценивается на свечах 4h.
      enabled: true
      weight: 0.5
    adaptive_grid:
      enabled: false  # Включить только после тщательных тестов
      weight: 1.0

# Риск-параметры (КРИТИЧЕСКИ ВАЖНО)
risk:
  # Риск на сделку
  risk_per_trade: 0.004  # 0.4% от капитала
  
  # Дневные/недельные лимиты
  daily_loss_limit: 0.02    # 2%
  weekly_loss_limit: 0.04   # 4%
  
  # Просадки
  soft_drawdown: 0.05       # 5% — снижение риска
  hard_drawdown: 0.08       # 8% — остановка
  emergency_drawdown: 0.10  # 10% — аварийная остановка
  
  # Экспозиция
  max_exposure_pct: 0.30    # 30% капитала в рыночном риске
  max_open_positions: 5
  
  # Волатильность
  high_volatility_multiplier: 0.5  # Уменьшение размера при высокой волатильности
  extreme_volatility_threshold: 0.15  # 15% ATR/price → Risk=0
  volatility_lookback: 20
  
  # Корреляция
  correlation_limit: 0.7  # Если корреляция > 0.7, считать позиции как одну
  
  # Адаптация риска по просадке
  drawdown_adaptation:
    - drawdown: 0
      risk_multiplier: 1.0
    - drawdown: 0.03
      risk_multiplier: 0.75
    - drawdown: 0.05
      risk_multiplier: 0.5
    - drawdown: 0.08
      risk_multiplier: 0.0

# ML настройки
ml:
  enabled: false  # Включить в V1.0
  model_type: "lightgbm"
  model_path: "models/"
  auto_train: false
  retraining_interval_days: 30
  min_training_samples: 1000
  train_split: 0.7
  validation_split: 0.15

# Telegram
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"  # Установите переменную окружения
  allowed_user_ids:
    - "${TELEGRAM_USER_ID}"
  admin_user_ids:
    - "${TELEGRAM_ADMIN_ID}"
  enable_alerts: true
  daily_report_time: "09:00"

# База данных
database:
  host: "${DB_HOST:-localhost}"
  port: 5432
  name: "astra_bot"
  user: "${DB_USER:-postgres}"
  password: "${DB_PASSWORD:-}"
  pool_size: 10

# Redis
redis:
  host: "${REDIS_HOST:-localhost}"
  port: 6379
  db: 0

# Биржи
exchanges:
  okx:
    enabled: true
    sandbox: true
    api_key: "${OKX_API_KEY}"      # Установите переменную окружения
    api_secret: "${OKX_API_SECRET}" # Установите переменную окружения
    passphrase: "${OKX_PASSPHRASE}" # Установите переменную окружения
    contract_type: "spot"
    base_url: "https://www.okx.com"
  
  bybit:
    enabled: false
    # Аналогично OKX

# Безопасность
security:
  # API ключи ДОЛЖНЫ быть без withdrawal permissions
  require_no_withdrawal: true
  
  # Рекомендуемые настройки API ключа:
  # - Read: YES
  # - Trade: YES
  # - Withdraw: NO
  
  # IP белый список (если доступно)
  ip_whitelist: []
  
  # Использовать отдельный trading subaccount
  use_subaccount: true

# Мониторинг
monitoring:
  enable_metrics: true
  metrics_port: 9090
  alert_channels:
    - "telegram"
  log_level: "INFO"
