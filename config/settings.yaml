# ASTRA BOT — Production Configuration
# ============================================================
# ⚠️ ВАЖНО: Все sensitive данные должны быть в .env файле!
# Не храните реальные ключи в этом файле.
# ============================================================

system:
  name: "ASTRA BOT"
  version: "1.0.0"
  environment: "production"  # development | paper | production
  paper_trading: false
  trading_enabled: true  # Только после полной валидации!

# ============================================================
# РЫНОЧНЫЕ ДАННЫЕ
# ============================================================
market_data:
  poll_interval_ms: 500
  websocket_reconnect_delay: 3
  stale_data_timeout_seconds: 3
  candle_timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "1h"
    - "4h"
    - "1d"
  max_candles_cache: 50000
  orderbook_depth: 25

# ============================================================
# УНИВЕРСУМ ИНСТРУМЕНТОВ
# ============================================================
trading:
  # Основной универсум (разрешено)
  instruments:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  
  # Дополнительный универсум (после liquidity check)
  # extended_instruments:
  #   - "XRP/USDT"
  #   - "BNB/USDT"
  #   - "DOGE/USDT"
  #   - "ADA/USDT"
  
  # Включённые стратегии
  strategies:
    momentum:
      enabled: true
      weight: 1.0
    mean_reversion:
      enabled: true
      weight: 1.0
    adaptive_grid:
      enabled: false  # Только после тщательных тестов!
      weight: 1.0
  
  # Параметры стратегий
  strategy_params:
    momentum:
      ema_short: 20
      ema_medium: 50
      ema_long: 200
      atr_stop_multiplier: 1.5
      volume_ratio_threshold: 1.5
      min_risk_reward: 1.5
    
    mean_reversion:
      bb_period: 20
      bb_std_dev: 2.0
      rsi_oversold: 30
      rsi_overbought: 70
      zscore_threshold: 2.0

# ============================================================
# РИСК-ПАРАМЕТРЫ (КРИТИЧЕСКИ ВАЖНО!)
# ============================================================
risk:
  # Риск на сделку
  risk_per_trade: 0.004  # 0.4% от капитала
  
  # Дневные/недельные лимиты
  daily_loss_limit: 0.02    # 2%
  weekly_loss_limit: 0.04   # 4%
  
  # Просадки
  soft_drawdown: 0.05       # 5% — снижение риска
  hard_drawdown: 0.08       # 8% — остановка
  emergency_drawdown: 0.10  # 10% — аварийная остановка
  
  # Экспозиция
  max_exposure_pct: 0.30    # 30% капитала в рыночном риске
  max_open_positions: 5
  
  # Волатильность
  high_volatility_multiplier: 0.5
  extreme_volatility_threshold: 0.15
  volatility_lookback: 20
  
  # Корреляция
  correlation_limit: 0.7
  
  # Адаптация риска по просадке
  drawdown_adaptation:
    - drawdown: 0
      risk_multiplier: 1.0
    - drawdown: 0.03
      risk_multiplier: 0.75
    - drawdown: 0.05
      risk_multiplier: 0.5
    - drawdown: 0.08
      risk_multiplier: 0.0

# ============================================================
# ML НАСТРОЙКИ
# ============================================================
ml:
  enabled: true
  model_type: "lightgbm"
  model_path: "models/production/"
  model_version: "ML-20260808-001"
  auto_train: false
  auto_deploy: false  # Только после ручного подтверждения!
  retraining_interval_days: 30
  min_training_samples: 1000
  train_split: 0.7
  validation_split: 0.15
  
  # Пороги для торговли
  min_probability: 0.55
  min_confidence: 0.3

# ============================================================
# TELEGRAM
# ============================================================
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  allowed_user_ids:
    - "${TELEGRAM_USER_ID}"
  admin_user_ids:
    - "${TELEGRAM_ADMIN_ID}"
  enable_alerts: true
  daily_report_time: "09:00"
  alert_on:
    - risk_warning
    - risk_stop
    - emergency_stop
    - order_filled
    - order_rejected
    - strategy_change
    - regime_change

# ============================================================
# БАЗА ДАННЫХ
# ============================================================
database:
  host: "${DB_HOST:-localhost}"
  port: 5432
  name: "astra_bot"
  user: "${DB_USER:-astra}"
  password: "${DB_PASSWORD}"
  pool_size: 20
  pool_timeout: 30

# ============================================================
# REDIS
# ============================================================
redis:
  host: "${REDIS_HOST:-localhost}"
  port: 6379
  db: 0
  password: "${REDIS_PASSWORD:-}"
  pool_size: 10

# ============================================================
# БИРЖИ
# ============================================================
exchanges:
  okx:
    enabled: true
    sandbox: false  # В production:false
    api_key: "${OKX_API_KEY}"
    api_secret: "${OKX_API_SECRET}"
    passphrase: "${OKX_PASSPHRASE}"
    contract_type: "spot"
    base_url: "https://www.okx.com"
    
    # Настройки для production
    trading_pairs:
      - "BTC/USDT"
      - "ETH/USDT"
      - "SOL/USDT"
    
    # Ограничения
    max_orders_per_minute: 30
    max_orders_per_day: 500
    
  bybit:
    enabled: false
    # Конфигурация аналогична OKX

# ============================================================
# БЕЗОПАСНОСТЬ
# ============================================================
security:
  # API ключи ОБЯЗАНЫ быть без withdrawal permissions
  require_no_withdrawal: true
  
  # IP whitelist (если доступно на бирже)
  ip_whitelist:
    - "${VPS_IP_ADDRESS}"
  
  # Использовать отдельную торговую подсчётную запись
  use_subaccount: true
  subaccount_name: "astra_trading"
  
  # Telegram безопасность
  telegram:
    require_admin_for_pause: true
    require_admin_for_resume: true
    require_admin_for_emergency_stop: false  # Для быстрого реагирования

# ============================================================
# МОНИТОРИНГ И АЛЕРТИНГ
# ============================================================
monitoring:
  enable_metrics: true
  metrics_port: 8000
  metrics_path: "/metrics"
  
  # Alert каналы
  alert_channels:
    - "telegram"
  
  # Логирование
  log_level: "INFO"
  log_file: "/app/logs/astra_bot.log"
  log_max_size: "10MB"
  log_backup_count: 5
  
  # Сохранение метрик
  metrics_retention_days: 30

# ============================================================
# BACKUP И ВОССТАНОВЛЕНИЕ
# ============================================================
backup:
  enabled: true
  schedule: "0 2 * * *"  # Ежедневно в 2:00
  retention_days: 30
  database_backup: true
  config_backup: true
  model_backup: true

# ============================================================
# СИСТЕМНЫЕ НАСТРОЙКИ
# ============================================================
system_settings:
  # Перезапуск при ошибках
  auto_restart: true
  max_restart_attempts: 3
  restart_delay_seconds: 60
  
  # Reconciliation
  reconciliation_interval_seconds: 60
  reconciliation_on_start: true
  
  # Circuit breaker
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout_seconds: 300
