# ASTRA BOT — Docker Compose
# Production deployment configuration

version: "3.8"

services:
  # === Main Application ===
  astra_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra_bot
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # RED: production без ASTRA_API_KEY в .env → 401 на /tick|/status.
      # Healthcheck бьёт открытый /health. Ключ только в .env (не в git).
      - ENVIRONMENT=production
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - model_volume:/app/models
    ports:
      - "8000:8000"  # Metrics endpoint
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - astra_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request,sys; p=os.environ.get('PORT','8000'); r=urllib.request.urlopen('http://127.0.0.1:%s/health' % p, timeout=5); sys.exit(0 if getattr(r,'status',200)==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # === PostgreSQL ===
  postgres:
    image: postgres:15-alpine
    container_name: astra_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=astra_bot
      - POSTGRES_USER=${DB_USER:-astra}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - astra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-astra} -d astra_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # === Redis ===
  redis:
    image: redis:7-alpine
    container_name: astra_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - astra_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # === Prometheus ===
  prometheus:
    image: prom/prometheus:latest
    container_name: astra_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - astra_network
    depends_on:
      - astra_bot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # === Grafana ===
  grafana:
    image: grafana/grafana:latest
    container_name: astra_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_password_change_me}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - astra_network
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # === Backup Service (optional) ===
  # restart: daily невалиден в Compose. Запуск — host cron:
  #   0 3 * * * docker compose --profile backup run --rm backup
  # либо systemd timer. Не в live-цикле бота.
  backup:
    image: postgres:15-alpine
    container_name: astra_backup
    restart: "no"
    profiles: ["backup"]
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_password_change_me}
    volumes:
      - postgres_backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/scripts/backup.sh"]
    networks:
      - astra_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  astra_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  postgres_backups:
    driver: local
  model_volume:
    driver: local
